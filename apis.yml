aid: goodfire
name: Goodfire
description: >-
  Goodfire is an AI interpretability research lab building tools to understand, debug, and
  intentionally design neural networks by surfacing the internal features (via sparse
  autoencoders) that drive model behavior. Its Ember API/SDK was the first hosted
  mechanistic-interpretability API, offering an OpenAI-compatible inference endpoint plus
  feature discovery, inspection, and steering over open models such as Llama 3.3 70B and
  Llama 3.1 8B. The company is now consolidating this interpretability work into its Silico
  platform, which spans large language models, life sciences, and robotics/vision. Backed by
  Lightspeed, Menlo Ventures, and Wing Venture Capital.
